[project]
name = "text-to-sql-agent"
version = "1.0.0"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["sqlagent", "corrupt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "eval"]
